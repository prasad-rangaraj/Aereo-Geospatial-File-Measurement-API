services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: aereo-geospatial-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/geospatial.db
      - DEFAULT_FALLBACK_CRS=EPSG:4326
      - MAX_UPLOAD_SIZE_BYTES=52428800
    volumes:
      - ./sample_data:/app/sample_data:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: aereo-geospatial-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
